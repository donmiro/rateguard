name: Bug report
description: Something admitted more, or less, than it should; a panic; a node that would not join.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Security issues go through private reporting instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What was admitted or denied, what you expected, and any error or panic message.
    validations:
      required: true
  - type: textarea
    id: cluster
    attributes:
      label: The cluster
      description: How many instances, the builder settings (limit, burst, partition_policy, protocol_period, hot_keys, tracked_keys), and what the network was doing.
      placeholder: |
        5 instances, .limit(1000), defaults otherwise; one instance lost its link for ~10 s.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smaller the better. A failing simulator test, or its RATEGUARD_SEED=... line, replays exactly.
  - type: input
    id: version
    attributes:
      label: Versions
      description: rateguard, Rust (rustc --version) and tokio.
      placeholder: rateguard 0.1.0, rustc 1.90.0, tokio 1.47
    validations:
      required: true
