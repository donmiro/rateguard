name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Simulator sweeps draw fresh seeds on every run; a failure prints
      # the RATEGUARD_SEED=... line that replays it locally.
      - name: Test
        run: cargo test --workspace --locked
      # The optional integrations, with the tests and example they gate.
      - name: Features
        run: cargo test -p rateguard --features tower,metrics --locked
      # The key table's races, explored exhaustively. A crate-local cfg:
      # `--cfg loom` would switch tokio into its own loom build too.
      - name: Loom
        run: cargo test -p rateguard --lib --release --locked table
        env:
          RUSTFLAGS: --cfg rateguard_loom
          # Bugs show within a few preemptions; unbounded, three threads over
          # sixteen candidate slots take far too long.
          LOOM_MAX_PREEMPTIONS: 3
      - name: Turmoil
        run: cargo test -p rateguard --features turmoil --locked --test turmoil
      # The guide's accuracy table must match what the simulator measures.
      - name: Accuracy report
        run: cargo run -p rateguard-sim --release --locked --bin accuracy -- --check

  # The clients of rateguard-sidecar, each on its own toolchain.
  sdk-python:
    # Pinned: setup-python has no 3.9, the oldest Python the client
    # supports, for the Ubuntu 26.04 that ubuntu-latest now is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Test
        working-directory: sdk/python
        run: PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Test
        working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Test
        working-directory: sdk/typescript
        run: npm test
      - name: Types
        working-directory: sdk/typescript
        run: npx -y -p typescript@5.6.3 tsc --noEmit --strict --module nodenext --moduleResolution nodenext --target es2022 test/types.ts

  # Each client against the real sidecar, not only its fake: sdk/live/run.sh
  # builds and starts it, and fails if a live test fails or is skipped.
  sdk-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Live tests
        run: sdk/live/run.sh

  # The oldest Rust the crates promise to build on (rust-version): 1.88,
  # for let chains.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
