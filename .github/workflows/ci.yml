name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Simulator sweeps draw fresh seeds on every run; a failure prints
      # the RATEGUARD_SEED=... line that replays it locally.
      - name: Test
        run: cargo test --workspace --locked
      # The key table's races, explored exhaustively. A crate-local cfg:
      # `--cfg loom` would switch tokio into its own loom build too.
      - name: Loom
        run: cargo test -p rateguard --lib --release --locked table
        env:
          RUSTFLAGS: --cfg rateguard_loom
          # Bugs show within a few preemptions; unbounded, three threads over
          # sixteen candidate slots take far too long.
          LOOM_MAX_PREEMPTIONS: 3
      - name: Turmoil
        run: cargo test -p rateguard --features turmoil --locked --test turmoil

  # The oldest Rust the crates promise to build on (rust-version): 1.88,
  # for let chains.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked
