[package]
name = "rateguard-sidecar"
description = "rateguard as a sidecar: one global rate limit for services in any language, over a local HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rate-limit", "rate-limiter", "distributed", "sidecar", "kubernetes"]
categories = ["network-programming", "web-programming", "command-line-utilities"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
rateguard = { version = "0.5.1", path = "../rateguard", features = ["metrics"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }
