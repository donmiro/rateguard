# Every second, each sidecar's --metrics-listen; `node` names it as
# compose does, where the guard label has its address.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: rateguard
    static_configs:
      - targets: ["a:9090"]
        labels: { node: a }
      - targets: ["b:9090"]
        labels: { node: b }
      - targets: ["c:9090"]
        labels: { node: c }
