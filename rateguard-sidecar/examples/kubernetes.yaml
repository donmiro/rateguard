# A service with rateguard-sidecar next to it, every replica sharing one
# limit. The replicas find each other through a headless service; the API
# stays on each pod's loopback, where only the app reaches it.
#
#     kubectl apply -f kubernetes.yaml
#
# The app calls http://127.0.0.1:7947/v1/check, or uses an SDK from sdk/.
#
# The gossip is signed with a secret every replica shares, and keys are
# hashed with a salt, both from the Secret api-rateguard, mounted below.
# Create it before applying this file, rather than writing it here:
#
#     openssl rand -base64 32 > gossip-secrets
#     openssl rand 16 > key-salt
#     kubectl create secret generic api-rateguard \
#       --from-file=gossip-secrets --from-file=key-salt
#
# gossip-secrets holds base64 lines, at most two, the first signing; the
# sidecar rereads it every 10 s. A rotation from A to B writes "A" and "B",
# then "B" and "A", then "B", each once every pod has the one before.
# key-salt is raw bytes, 16 or more, changed only by restarting every pod
# at once. A cluster already running unsigned turns signing on in steps,
# RATEGUARD_GOSSIP_AUTH=transitional first: see the sidecar's README.
apiVersion: v1
kind: Service
metadata:
  name: api-rateguard
spec:
  # Headless: the name resolves to every pod, which is all a seed needs.
  clusterIP: None
  # Pods not ready yet are listed too: a new replica must find the others
  # before it is ready, and holds every key at the floor until it has.
  publishNotReadyAddresses: true
  selector:
    app: api
  ports:
    - name: gossip
      port: 7946
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # On SIGTERM the sidecar leaves the cluster, then answers for
      # RATEGUARD_DRAIN, 10 s by default, while the app drains: keep the
      # grace period above it. On Kubernetes 1.29 or newer, the sidecar can
      # also be a native sidecar, an init container with
      # restartPolicy: Always, which is stopped only after the app.
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: your-service:latest
          env:
            - name: RATEGUARD_SIDECAR_URL
              value: http://127.0.0.1:7947
        - name: rateguard
          image: rateguard-sidecar:0.6.0
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RATEGUARD_ADVERTISE
              value: $(POD_IP):7946
            - name: RATEGUARD_SEEDS
              value: api-rateguard:7946
            - name: RATEGUARD_LIMIT
              value: "1000"
            - name: RATEGUARD_CLASSES
              value: pro=5000/250,free=50
            - name: RATEGUARD_METRICS_LISTEN
              value: 0.0.0.0:9090
            # From the volume below: the files never show in the
            # environment or in ps. With a secret file, the mode is
            # `required` unless RATEGUARD_GOSSIP_AUTH says otherwise.
            - name: RATEGUARD_GOSSIP_SECRET_FILE
              value: /etc/rateguard/gossip-secrets
            - name: RATEGUARD_KEY_SALT_FILE
              value: /etc/rateguard/key-salt
          volumeMounts:
            # The whole directory, not a subPath: Kubernetes updates it in
            # place when the Secret changes, and the sidecar rereads it.
            - name: rateguard-secrets
              mountPath: /etc/rateguard
              readOnly: true
          ports:
            - name: gossip
              containerPort: 7946
              protocol: UDP
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: rateguard-secrets
          secret:
            secretName: api-rateguard
