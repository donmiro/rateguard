[package]
name = "rateguard"
description = "Distributed rate limiting without a datastore: one global limit, enforced locally"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["rate-limit", "rate-limiter", "distributed", "gossip", "tokio"]
categories = ["network-programming", "web-programming", "concurrency"]

[dependencies]
rateguard-core = { version = "0.1.1", path = "../rateguard-core" }
rateguard-proto = { version = "0.1.1", path = "../rateguard-proto" }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
turmoil = { version = "0.7", optional = true }

[features]
# A Transport for turmoil's simulated UDP, for the wiring tests.
turmoil = ["dep:turmoil"]

[dev-dependencies]
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "time", "macros", "test-util"] }
criterion = "0.8"
# examples/axum.rs, the middleware of the README.
axum = "0.8"

[[bench]]
name = "check"
harness = false

[target.'cfg(rateguard_loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rateguard_loom)"] }
