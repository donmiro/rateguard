[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rateguard-client"
version = "0.5.1"
description = "Client for rateguard-sidecar: one global rate limit across a fleet, enforced locally"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.urls]
Repository = "https://github.com/donmiro/rateguard"

[tool.setuptools.packages.find]
where = ["src"]
